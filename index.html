<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahmat Chef Delivery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:#0f0f0f;
color:white;
}

header{
position:sticky;
top:0;
background:#111;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
z-index:1000;
}

.logo{
font-weight:600;
font-size:18px;
color:#00c853;
}

.tabs{
display:flex;
overflow-x:auto;
padding:10px;
background:#111;
}

.tabs button{
background:#1a1a1a;
color:#aaa;
border:none;
margin-right:10px;
padding:8px 16px;
border-radius:20px;
cursor:pointer;
}

.tabs button.active{
background:#00c853;
color:black;
}

.container{
padding:15px;
}

.card{
background:#1a1a1a;
padding:15px;
border-radius:15px;
margin-bottom:12px;
box-shadow:0 4px 20px rgba(0,0,0,0.4);
transition:0.3s;
}

.card:hover{
transform:scale(1.02);
}

.card h3{
margin:0;
}

.price{
color:#00c853;
margin-top:5px;
font-weight:bold;
}

button{
margin-top:10px;
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#00c853;
color:black;
font-weight:bold;
cursor:pointer;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
background:#111;
padding:10px;
text-align:center;
border-top:1px solid #222;
}

.bottom a{
background:#00c853;
color:black;
padding:12px 25px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.hero{
padding:20px;
text-align:center;
background:linear-gradient(135deg,#00c853,#004d40);
}

.hero h1{
margin:0;
font-size:24px;
}

.hero p{
margin-top:5px;
font-size:14px;
color:#eee;
}
</style>
</head>

<body>

<header>
<div class="logo">Rahmat Chef</div>
<div>24/7</div>
</header>

<div class="hero">
<h1>Mazali taomlar 🍽</h1>
<p>Har kuni, har vaqtda siz uchun</p>
</div>

<div class="tabs">
<button onclick="show('bar')" class="active">Bar</button>
<button onclick="show('coffee')">Coffee</button>
<button onclick="show('dessert')">Dessert</button>
</div>

<div class="container">

<div id="bar" class="menu">
<div class="card">
<h3>Ko‘k choy</h3>
<div class="price">15 000 so‘m</div>
<button onclick="order('Ko‘k choy')">Buyurtma</button>
</div>

<div class="card">
<h3>Imbir choy</h3>
<div class="price">25 000 so‘m</div>
<button onclick="order('Imbir choy')">Buyurtma</button>
</div>
</div>

<div id="coffee" class="menu" style="display:none">
<div class="card">
<h3>Cappuccino</h3>
<div class="price">30 000 so‘m</div>
<button onclick="order('Cappuccino')">Buyurtma</button>
</div>

<div class="card">
<h3>Latte</h3>
<div class="price">30 000 so‘m</div>
<button onclick="order('Latte')">Buyurtma</button>
</div>
</div>

<div id="dessert" class="menu" style="display:none">
<div class="card">
<h3>Cheesecake</h3>
<div class="price">35 000 so‘m</div>
<button onclick="order('Cheesecake')">Buyurtma</button>
</div>

<div class="card">
<h3>Medovik</h3>
<div class="price">35 000 so‘m</div>
<button onclick="order('Medovik')">Buyurtma</button>
</div>
</div>

</div>

<div class="bottom">
<a href="https://t.me/rahmatchef_delivery_bot">Buyurtma berish</a>
</div>

<script>
function show(id){
document.querySelectorAll('.menu').forEach(el=>el.style.display='none');
document.getElementById(id).style.display='block';

document.querySelectorAll('.tabs button').forEach(btn=>btn.classList.remove('active'));
event.target.classList.add('active');
}

function order(item){
window.location.href="https://t.me/rahmatchef_delivery_bot?start="+encodeURIComponent(item);
}
</script>

</body>
</html>
