<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahmat Chef</title>

<style>
body{margin:0;font-family:sans-serif;background:#0f0f0f;color:white}
.header{padding:15px;background:#111;display:flex;justify-content:space-between}
.card{background:#1a1a1a;margin:10px;padding:15px;border-radius:10px}
button{background:#00c853;border:none;padding:10px;width:100%;margin-top:10px;border-radius:8px}
.cart{position:fixed;top:10px;right:10px;background:#00c853;padding:10px;border-radius:10px;color:black}
.bottom{position:fixed;bottom:0;width:100%;background:#111;padding:10px;text-align:center}
</style>
</head>

<body>

<div class="header">
<div>Rahmat Chef</div>
<div>24/7</div>
</div>

<div class="cart">🛒 <span id="count">0</span></div>

<div class="card">
<h3>Ko‘k choy</h3>
<p>15000</p>
<button onclick="add('Ko‘k choy')">Qo‘shish</button>
</div>

<div class="card">
<h3>Cappuccino</h3>
<p>30000</p>
<button onclick="add('Cappuccino')">Qo‘shish</button>
</div>

<div class="card">
<h3>Cheesecake</h3>
<p>35000</p>
<button onclick="add('Cheesecake')">Qo‘shish</button>
</div>

<div class="bottom">
<button onclick="order()">Buyurtma berish</button>
</div>

<script>
let cart = [];

function add(item){
cart.push(item);
document.getElementById("count").innerText = cart.length;
}

function order(){
let text = "Buyurtma:\n" + cart.join("\n");

fetch("YOUR_GOOGLE_SCRIPT_URL", {
method:"POST",
body: JSON.stringify({order:text})
});

window.location.href =
"https://t.me/rahmatchef_delivery_bot?start=" + encodeURIComponent(text);
}
</script>

</body>
</html>
