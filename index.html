<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahmat Chef Delivery App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#orders">Orders</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="home">
            <h1>Welcome to Rahmat Chef</h1>
            <p>Delicious meals delivered to your door!</p>
        </section>
        <section id="menu">
            <h2>Our Menu</h2>
            <div class="card">
                <h3>Dish Name</h3>
                <p>Description of the dish.</p>
                <button>Order Now</button>
            </div>
            <!-- Repeat card structure for more dishes -->
        </section>
        <section id="orders">
            <h2>Your Orders</h2>
            <p>Manage your orders here.</p>
        </section>
        <section id="contact">
            <h2>Contact Us</h2>
            <p>You can reach us via our <a href="https://telegram.me/YourBotLink">Telegram Bot</a></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Rahmat Chef. All rights reserved.</p>
    </footer>
</body>
</html>
