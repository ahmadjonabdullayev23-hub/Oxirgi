<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Rahmat Chef</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { position: sticky; top: 0; background-color: #fff; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav { display: flex; justify-content: space-around; background: #f8f8f8; padding: 10px; }
        nav a { text-decoration: none; padding: 10px 20px; color: #333; }
        .categories { text-align: center; margin: 20px 0; }
        .bottom-bar { position: fixed; bottom: 0; width: 100%; background: #007BFF; color: white; text-align: center; padding: 20px; }
        .bottom-bar button { background: white; color: #007BFF; border: none; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Rahmat Chef</h1>
    </header>
    <nav>
        <a href="#bar">Bar</a>
        <a href="#coffee">Coffee</a>
        <a href="#dessert">Dessert</a>
    </nav>
    <div class="categories">
        <h2>Categories</h2>
        <p>Explore our delicious offerings!</p>
    </div>
    <div class="bottom-bar">
        <button>Order Now</button>
    </div>
</body>
</html>
