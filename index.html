<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Rahmat Chef</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #181818;
            color: white;
        }
        .hero {
            background-color: #00c853;
            padding: 50px;
            text-align: center;
        }
        .menu-item {
            margin: 20px;
            padding: 10px;
            background-color: #333;
            border-radius: 5px;
        }
        .price {
            color: #00c853;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Welcome to Rahmat Chef</h1>
        <p>Experience the best culinary delights!</p>
    </div>
    <div class="menu">
        <div class="menu-item">
            <h2>Imbir choy</h2>
            <p class="price">25,000 so'm</p>
        </div>
        <div class="menu-item">
            <h2>Latte</h2>
            <p class="price">30,000 so'm</p>
        </div>
    </div>
</body>
</html>
